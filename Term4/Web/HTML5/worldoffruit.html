<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>The World of Fruit</title>
  </head>
  <body>
    <br><br><br>
    <table align="center" width="600" cellspacing="0" cellpadding="5">
      <tr bgcolor="#FFCC00">
        <td align="center"><b>The World of Fruit</b></td>
      </tr>

      <tr bgcolor="#FFFF99">
        <td>
          <form>
            <legend align="center"><b>Fruit Surbey</b></legend>
            <table cellspacing="10">
              <tr>
                <td align="right"><label for="name">Name</label></td>
                <td><input type="text" id="name"></td>
              </tr>

              <tr>
                <td align="right"><label for="address">Address</label></td>
                <td><input type="address" id="address"></td>
              </tr>

              <tr>
                <td align="right"><label for="email">Email</label></td>
                <td><input type="email" id="email"></td>
              </tr>

              <tr>
                <td align="right" valign="top" width="170">
                  How many pieces of fruit do you eat per day?</td>
                <td>
                  <input type="radio" name="fav" id="rzero"><label for="rzero"> 0</label><br>
                  <input type="radio" name="fav" id="rone"><label for="rone"> 1</label><br>
                  <input type="radio" name="fav" id="rtwo"><label for="rtwo"> 2</label><br>
                  <input type="radio" name="fav" id="rmore"><label for="rmore"> More than 2</label><br>

                </td>
              </tr>


              <tr>
                <td align="right" valign="top">My favourite fruit</td>
                <td>
                  <select size="4">
                    <option>Apple</option>
                    <option>Banana</option>
                    <option>Plum</option>
                    <option>Pomegranate</option>
                  </select>

                </td>
              </tr>

              <tr>
                <td align="right" valign="top" width="170">
                  <label for="email">Would you like a brochure?</label></td>
                <td>
                  <input type="checkbox" id="brochure"><br>

                </td>
              </tr>

              <tr>
                <td></td>
                <td><input type="submit" value="Submit"></td>
              </tr>


            </table>
          </form>
        </td>
      </tr>
    </table>
  </body>
</html>
